<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Pre-Sales Resource Analyzer</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .file-upload-area {
            border: 2px dashed #cbd5e0;
            transition: all 0.3s;
        }
        .file-upload-area:hover, .file-upload-area.drag-over {
            border-color: #4299e1;
            background-color: #ebf8ff;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [file, setFile] = useState(null);
            const [analyzing, setAnalyzing] = useState(false);
            const [results, setResults] = useState(null);
            const [error, setError] = useState(null);
            const [dragOver, setDragOver] = useState(false);
            
            // Agent setup state
            const [agentsConfigured, setAgentsConfigured] = useState(null); // null = checking, true/false
            const [settingUpAgents, setSettingUpAgents] = useState(false);
            const [recreatingAgents, setRecreatingAgents] = useState(false);
            const [setupError, setSetupError] = useState(null);
            const [agentStatus, setAgentStatus] = useState(null);

            // Check agent status on mount
            useEffect(() => {
                checkAgentStatus();
            }, []);

            const checkAgentStatus = async () => {
                try {
                    const response = await fetch('http://localhost:8080/api/agents/status');
                    if (!response.ok) throw new Error('Failed to check agent status');
                    const data = await response.json();
                    setAgentsConfigured(data.agents_configured);
                    setAgentStatus(data);
                } catch (err) {
                    console.error('Failed to check agent status:', err);
                    setAgentsConfigured(false);
                }
            };

            const setupAgents = async () => {
                setSettingUpAgents(true);
                setSetupError(null);
                
                try {
                    const response = await fetch('http://localhost:8080/api/agents/setup', {
                        method: 'POST'
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || 'Setup failed');
                    }
                    
                    const data = await response.json();
                    setAgentsConfigured(true);
                    setAgentStatus(data);
                    alert(`✅ Successfully created ${data.created_agents.length} agents!`);
                } catch (err) {
                    setSetupError(err.message);
                } finally {
                    setSettingUpAgents(false);
                }
            };

            const recreateAgents = async () => {
                if (!confirm('⚠️ This will delete all existing agents and recreate them from scratch. Are you sure?')) {
                    return;
                }
                
                setRecreatingAgents(true);
                setSetupError(null);
                
                try {
                    const response = await fetch('http://localhost:8080/api/agents/recreate', {
                        method: 'POST'
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || 'Recreate failed');
                    }
                    
                    const data = await response.json();
                    setAgentsConfigured(true);
                    
                    // Refresh agent status
                    await checkAgentStatus();
                    
                    alert(`✅ Successfully deleted ${data.deleted_agents.length} agents and recreated ${data.created_agents.length} agents!`);
                } catch (err) {
                    setSetupError(err.message);
                    alert(`❌ Failed to recreate agents: ${err.message}`);
                } finally {
                    setRecreatingAgents(false);
                }
            };

            const handleFileSelect = (e) => {
                const selectedFile = e.target.files[0];
                if (selectedFile) {
                    setFile(selectedFile);
                    setResults(null);
                    setError(null);
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setDragOver(true);
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                setDragOver(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setDragOver(false);
                const droppedFile = e.dataTransfer.files[0];
                if (droppedFile) {
                    setFile(droppedFile);
                    setResults(null);
                    setError(null);
                }
            };

            const analyzeFile = async () => {
                if (!file) return;

                setAnalyzing(true);
                setError(null);
                setResults(null);

                const formData = new FormData();
                formData.append('file', file);

                const ext = file.name.toLowerCase();
                let endpoint = '/analyze-document';
                if (ext.endsWith('.pdf')) {
                    endpoint = '/analyze-pdf';
                } else if (ext.endsWith('.xlsx') || ext.endsWith('.xls')) {
                    endpoint = '/analyze-excel';
                }

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 1200000);
                    
                    const response = await fetch(`http://localhost:8080${endpoint}`, {
                        method: 'POST',
                        body: formData,
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || 'Analysis failed');
                    }

                    const data = await response.json();
                    setResults(data);
                } catch (err) {
                    if (err.name === 'AbortError') {
                        setError('Request timed out after 20 minutes.');
                    } else {
                        setError(err.message);
                    }
                } finally {
                    setAnalyzing(false);
                }
            };

            return (
                <div className="min-h-screen py-8 px-4">
                    <div className="max-w-6xl mx-auto">
                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-bold text-gray-900 mb-2">
                                ☁️ Azure Pre-Sales Resource Analyzer
                            </h1>
                            <p className="text-gray-600">
                                Upload documents to identify Azure resources for commercial proposals
                            </p>
                        </div>

                        {/* Agent Setup Banner */}
                        {agentsConfigured === false && (
                            <div className="bg-yellow-50 border-l-4 border-yellow-400 p-6 mb-6 rounded-lg shadow-md">
                                <div className="flex items-start">
                                    <div className="flex-shrink-0">
                                        <svg className="h-6 w-6 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                        </svg>
                                    </div>
                                    <div className="ml-3 flex-1">
                                        <h3 className="text-sm font-medium text-yellow-800">
                                            Agents Not Configured
                                        </h3>
                                        <div className="mt-2 text-sm text-yellow-700">
                                            <p>
                                                {agentStatus ? (
                                                    <>Missing {agentStatus.missing_count} of {agentStatus.total_required} required agents: {agentStatus.missing_agents.join(', ')}</>
                                                ) : (
                                                    'The AI agents need to be created in Azure AI Foundry before you can analyze documents.'
                                                )}
                                            </p>
                                        </div>
                                        <div className="mt-4">
                                            <button
                                                onClick={setupAgents}
                                                disabled={settingUpAgents}
                                                className="bg-yellow-600 hover:bg-yellow-700 disabled:bg-gray-400 text-white font-semibold py-2 px-4 rounded transition-colors"
                                            >
                                                {settingUpAgents ? (
                                                    <span className="flex items-center">
                                                        <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                        </svg>
                                                        Setting up agents...
                                                    </span>
                                                ) : (
                                                    '🚀 Setup Agents Now'
                                                )}
                                            </button>
                                        </div>
                                        {setupError && (
                                            <div className="mt-3 text-sm text-red-600">
                                                ❌ Setup failed: {setupError}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Loading state for agent check */}
                        {agentsConfigured === null && (
                            <div className="bg-blue-50 border-l-4 border-blue-400 p-4 mb-6 rounded-lg">
                                <p className="text-sm text-blue-700 text-center">
                                    🔍 Checking agent configuration...
                                </p>
                            </div>
                        )}

                        {/* Success banner */}
                        {agentsConfigured === true && agentStatus && (
                            <div className="bg-green-50 border-l-4 border-green-400 p-4 mb-6 rounded-lg">
                                <div className="flex items-center justify-between">
                                    <p className="text-sm text-green-700">
                                        ✅ All {agentStatus.total_required || agentStatus.existing_count} agents are configured and ready
                                    </p>
                                    <button
                                        onClick={recreateAgents}
                                        disabled={recreatingAgents}
                                        className="bg-orange-500 hover:bg-orange-600 disabled:bg-gray-400 text-white text-sm font-medium py-2 px-4 rounded transition-colors ml-4"
                                        title="Delete all agents and recreate them with updated configuration"
                                    >
                                        {recreatingAgents ? (
                                            <span className="flex items-center">
                                                <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                Recreating...
                                            </span>
                                        ) : (
                                            '🔄 Recreate All Agents'
                                        )}
                                    </button>
                                </div>
                            </div>
                        )}

                        <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                            <div 
                                className={`file-upload-area rounded-lg p-8 text-center cursor-pointer ${dragOver ? 'drag-over' : ''}`}
                                onDragOver={handleDragOver}
                                onDragLeave={handleDragLeave}
                                onDrop={handleDrop}
                                onClick={() => document.getElementById('fileInput').click()}
                            >
                                <input
                                    id="fileInput"
                                    type="file"
                                    onChange={handleFileSelect}
                                    accept=".txt,.pdf,.xlsx,.xls"
                                    className="hidden"
                                />
                                <div className="text-gray-600">
                                    <svg className="mx-auto h-12 w-12 text-gray-400 mb-3" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                                        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                                    </svg>
                                    {file ? (
                                        <p className="text-lg font-medium text-blue-600">{file.name}</p>
                                    ) : (
                                        <>
                                            <p className="text-lg font-medium">Drop file here or click to upload</p>
                                            <p className="text-sm mt-1">Supports: .txt, .pdf, .xlsx, .xls</p>
                                        </>
                                    )}
                                </div>
                            </div>
                            
                            {file && (
                                <div className="mt-4 flex justify-center">
                                    <button
                                        onClick={analyzeFile}
                                        disabled={analyzing || agentsConfigured !== true}
                                        className="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-semibold py-3 px-8 rounded-lg transition-colors"
                                    >
                                        {analyzing ? (
                                            <span className="flex items-center">
                                                <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                Analyzing...
                                            </span>
                                        ) : agentsConfigured !== true ? (
                                            '⚠️ Setup Agents First'
                                        ) : (
                                            '🚀 Analyze Document'
                                        )}
                                    </button>
                                </div>
                            )}
                            
                            {analyzing && (
                                <div className="mt-4 bg-blue-50 border border-blue-200 rounded-lg p-4">
                                    <p className="text-sm text-blue-800 text-center">
                                        ⚙️ Analyzing document and identifying Azure resources...
                                    </p>
                                </div>
                            )}
                        </div>

                        {error && (
                            <div className="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded">
                                <p className="text-sm text-red-700">{error}</p>
                            </div>
                        )}

                        {results && <ResultsDisplay results={results} />}
                    </div>
                </div>
            );
        }

        function ResultsDisplay({ results }) {
            // Extract resources from the response - using top-level resources array
            let resources = results.resources || results.recommended_azure_resources || [];
            
            // Parse agent responses to get detailed content
            const agentResponses = results.agent_responses || [];
            const extractorResponse = agentResponses.find(a => a.agent_name === 'ArchitectureDetailExtractor');
            const calculatorResponse = agentResponses.find(a => a.agent_name === 'AzureCalculatorSpecialist');
            const orchestratorResponse = agentResponses.find(a => a.agent_name === 'AzureResourcesSpecialist');
            
            // Parse extractor to get architecture patterns
            let architectureDetails = null;
            if (extractorResponse) {
                try {
                    architectureDetails = typeof extractorResponse.content === 'string' 
                        ? JSON.parse(extractorResponse.content)
                        : extractorResponse.content;
                } catch (e) {
                    console.error('Error parsing extractor response:', e);
                }
            }
            
            // Parse calculator for cost details
            let costDetails = null;
            if (calculatorResponse) {
                try {
                    costDetails = typeof calculatorResponse.content === 'string' 
                        ? JSON.parse(calculatorResponse.content)
                        : calculatorResponse.content;
                } catch (e) {
                    console.error('Error parsing calculator response:', e);
                }
            }
            
            // Parse orchestrator for summary and cost_summary
            let orchestratorDetails = null;
            let costSummaryFromOrchestrator = null;
            if (orchestratorResponse) {
                try {
                    orchestratorDetails = typeof orchestratorResponse.content === 'string' 
                        ? JSON.parse(orchestratorResponse.content)
                        : orchestratorResponse.content;
                    
                    // Get cost summary from orchestrator if available
                    costSummaryFromOrchestrator = orchestratorDetails?.cost_summary;
                } catch (e) {
                    console.error('Error parsing orchestrator response:', e);
                }
            }
            
            // Use cost summary from orchestrator (which has pricing embedded) or calculator
            const costSummary = costSummaryFromOrchestrator || costDetails?.cost_summary;
            
            // Resources already have pricing embedded from the orchestrator
            // No need to merge - pricing is already part of each resource object
            console.log('Resources with embedded pricing:', resources);

            return (
                <div className="space-y-6">
                    {/* Main Summary Card */}
                    <div className="bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-lg shadow-lg p-6">
                        <h2 className="text-2xl font-bold mb-2">Azure Resources for Commercial Proposal</h2>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                            <div>
                                <p className="text-blue-200">Resources</p>
                                <p className="text-2xl font-bold">{resources.length}</p>
                            </div>
                            <div>
                                <p className="text-blue-200">Agents Used</p>
                                <p className="text-2xl font-bold">{results.agents_used || agentResponses.length}</p>
                            </div>
                            <div>
                                <p className="text-blue-200">Processing Time</p>
                                <p className="text-2xl font-bold">{results.processing_time_seconds?.toFixed(1)}s</p>
                            </div>
                            <div>
                                <p className="text-blue-200">Status</p>
                                <p className="text-2xl font-bold">{results.status === 'success' ? '✅' : '⚠️'}</p>
                            </div>
                        </div>
                        {costSummary && (
                            <div className="mt-4 pt-4 border-t border-blue-500">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <p className="text-sm text-blue-200">Monthly Cost</p>
                                        <p className="text-2xl font-bold">${costSummary.total_monthly_cost?.toFixed(2) || '0.00'}</p>
                                    </div>
                                    <div>
                                        <p className="text-sm text-blue-200">Annual Cost</p>
                                        <p className="text-2xl font-bold">${costSummary.total_annual_cost?.toFixed(2) || '0.00'}</p>
                                    </div>
                                    <div>
                                        <p className="text-sm text-blue-200">Resources Priced</p>
                                        <p className="text-2xl font-bold">
                                            {orchestratorDetails?.validation?.resources_with_pricing || 
                                             costSummary.resources_with_pricing || 
                                             resources.filter(r => r.pricing?.pricing_status === 'found').length}/{resources.length}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Architecture Patterns */}
                    {(results.architecture_patterns?.length > 0 || architectureDetails?.architecture_patterns?.length > 0) && (
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                                <span className="text-2xl mr-2">🏗️</span>
                                Architecture Patterns Identified
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {(results.architecture_patterns || architectureDetails?.architecture_patterns || []).map((pattern, idx) => (
                                    <div key={idx} className="flex items-start bg-blue-50 rounded-lg p-3">
                                        <span className="text-blue-600 mr-2">▸</span>
                                        <span className="text-sm text-gray-700">{pattern}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Azure Services Summary */}
                    {results.azure_services?.length > 0 && (
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                                <span className="text-2xl mr-2">☁️</span>
                                Azure Services Used ({results.azure_services.length})
                            </h3>
                            <div className="flex flex-wrap gap-2">
                                {results.azure_services.map((service, idx) => (
                                    <span key={idx} className="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800">
                                        {service}
                                    </span>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Cost Breakdown by Category */}
                    {costSummary?.breakdown_by_category && (
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-900 mb-4">💰 Cost Breakdown by Category</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                {Object.entries(costSummary.breakdown_by_category).map(([category, data]) => (
                                    data.monthly_cost > 0 && (
                                        <div key={category} className="bg-gradient-to-br from-gray-50 to-gray-100 rounded-lg p-4">
                                            <p className="text-sm text-gray-600 capitalize mb-1">{category}</p>
                                            <p className="text-2xl font-bold text-gray-900">${data.monthly_cost?.toFixed(2)}</p>
                                            <div className="mt-2 bg-gray-200 rounded-full h-2">
                                                <div 
                                                    className="bg-blue-600 h-2 rounded-full" 
                                                    style={{width: `${data.percentage}%`}}
                                                ></div>
                                            </div>
                                            <p className="text-xs text-gray-600 mt-1">{data.percentage?.toFixed(1)}% of total</p>
                                        </div>
                                    )
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Top Cost Drivers */}
                    {(costDetails?.top_cost_drivers || calculateTopCostDrivers(resources))?.length > 0 && (
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-900 mb-4">📊 Top Cost Drivers</h3>
                            <div className="space-y-2">
                                {(costDetails?.top_cost_drivers || calculateTopCostDrivers(resources)).map((driver, idx) => (
                                    <div key={idx} className="flex items-center justify-between p-4 bg-gradient-to-r from-gray-50 to-white rounded-lg border border-gray-200 hover:shadow-md transition-shadow">
                                        <div className="flex items-center gap-3 flex-1">
                                            <span className="flex items-center justify-center w-8 h-8 rounded-full bg-blue-600 text-white font-bold text-sm">
                                                #{driver.rank || idx + 1}
                                            </span>
                                            <div className="flex-1">
                                                <p className="font-medium text-gray-900">{driver.resource_name || driver.requirement}</p>
                                                <p className="text-xs text-gray-600">{driver.azure_service || 'Azure Service'}</p>
                                            </div>
                                        </div>
                                        <div className="text-right ml-4">
                                            <p className="text-xl font-bold text-gray-900">${driver.monthly_cost?.toFixed(2)}</p>
                                            <p className="text-xs text-gray-600">/month</p>
                                            <div className="mt-1 flex items-center justify-end">
                                                <div className="bg-blue-100 text-blue-800 text-xs font-semibold px-2 py-1 rounded">
                                                    {driver.percentage_of_total?.toFixed(1)}%
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Technical Requirements */}
                    {architectureDetails?.technical_requirements?.length > 0 && (
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                                <span className="text-2xl mr-2">⚙️</span>
                                Technical Requirements
                            </h3>
                            <ul className="space-y-2">
                                {architectureDetails.technical_requirements.map((req, idx) => (
                                    <li key={idx} className="flex items-start text-sm text-gray-700">
                                        <span className="text-green-600 mr-2 mt-1">✓</span>
                                        <span>{req}</span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}

                    {/* Recommended Azure Resources */}
                    <div className="bg-white rounded-lg shadow-md overflow-hidden">
                        <div className="px-6 py-4 bg-gradient-to-r from-blue-50 to-blue-100 border-b border-blue-200">
                            <h3 className="text-lg font-semibold text-gray-900 flex items-center">
                                <span className="text-2xl mr-2">🎯</span>
                                Recommended Azure Services ({resources.length})
                            </h3>
                        </div>
                        
                        <div className="divide-y divide-gray-200">
                            {resources.map((resource, idx) => (
                                <div key={idx} className="p-6 hover:bg-gray-50 transition-colors">
                                    <div className="flex items-start justify-between mb-4">
                                        <div className="flex-1">
                                            <div className="flex items-start gap-3 mb-3">
                                                <span className="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold text-sm">
                                                    {idx + 1}
                                                </span>
                                                <div className="flex-1">
                                                    <h4 className="text-lg font-semibold text-gray-900 mb-2">

                                    {resource.configuration_recommendations && resource.configuration_recommendations.length > 0 && (
                                        <div className="mb-4 p-4 bg-indigo-50 rounded-lg border-l-4 border-indigo-500">
                                            <h5 className="text-sm font-semibold text-gray-700 mb-2">⚙️ Configuration Recommendations</h5>

                            ))}
                        </div>
                    </div>

                    {/* Cost Optimization Summary */}
                    {(costDetails?.optimization_summary || calculateOptimizationSummary(costSummary)) && (
                        <div className="bg-gradient-to-br from-green-50 to-green-100 border-l-4 border-green-500 rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                                <span className="text-2xl mr-2">💡</span>
                                Cost Optimization Opportunities
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {(costDetails?.optimization_summary?.potential_monthly_savings_1year_ri || 
                                  calculateOptimizationSummary(costSummary)?.potential_monthly_savings_1year_ri) && (
                                    <div className="bg-white rounded-lg p-5 shadow-sm border border-green-200">
                                        <div className="flex items-center gap-2 mb-2">
                                            <span className="text-xl">📅</span>
                                            <p className="text-sm font-medium text-gray-700">1-Year Reserved Instances</p>
                                        </div>
                                        <p className="text-3xl font-bold text-green-700 mb-2">
                                            -${(costDetails?.optimization_summary?.potential_monthly_savings_1year_ri || 
                                                calculateOptimizationSummary(costSummary)?.potential_monthly_savings_1year_ri)?.toFixed(2)}
                                        </p>
                                        <p className="text-sm text-gray-600">monthly savings (~30%)</p>
                                        <div className="mt-3 pt-3 border-t border-gray-200">
                                            <p className="text-xs text-gray-600">New Monthly Cost</p>
                                            <p className="text-lg font-bold text-gray-900">
                                                ${(costDetails?.optimization_summary?.optimized_monthly_cost_1year_ri ||
                                                   calculateOptimizationSummary(costSummary)?.optimized_monthly_cost_1year_ri)?.toFixed(2)}
                                            </p>
                                        </div>

                                {(costDetails?.optimization_summary?.potential_monthly_savings_3year_ri ||

                                    <div className="bg-white rounded-lg p-5 shadow-sm border border-green-200">
                                        <div className="flex items-center gap-2 mb-2">
                                            <span className="text-xl">📅</span>
                                            <p className="text-sm font-medium text-gray-700">3-Year Reserved Instances</p>
                                        </div>
                                        <p className="text-3xl font-bold text-green-700 mb-2">
                                            -${(costDetails?.optimization_summary?.potential_monthly_savings_3year_ri || 
                                                calculateOptimizationSummary(costSummary)?.potential_monthly_savings_3year_ri)?.toFixed(2)}
                                        </p>
                                        <p className="text-sm text-gray-600">monthly savings (~50%)</p>
                                        <div className="mt-3 pt-3 border-t border-gray-200">
                                            <p className="text-xs text-gray-600">New Monthly Cost</p>
                                            <p className="text-lg font-bold text-gray-900">
                                                ${(costDetails?.optimization_summary?.optimized_monthly_cost_3year_ri ||
                                                   calculateOptimizationSummary(costSummary)?.optimized_monthly_cost_3year_ri)?.toFixed(2)}
                                            </p>

                    {/* Recommendations */}
                    {results.recommendations?.length > 0 && (
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                                <span className="text-2xl mr-2">💡</span>

                            </h3>
                            <div className="space-y-3">
                                {results.recommendations.map((rec, idx) => (
                                    <div key={idx} className="flex items-start bg-blue-50 rounded-lg p-4 border-l-4 border-blue-500">
                                        <span className="flex-shrink-0 w-6 h-6 bg-blue-600 text-white rounded-full flex items-center justify-center text-xs font-bold mr-3 mt-0.5">
                                            {idx + 1}

                    {/* Agent Responses Details */}
                    <div className="bg-white rounded-lg shadow-md overflow-hidden">
                        <div className="px-6 py-4 bg-gray-50 border-b border-gray-200">

                        <div className="divide-y divide-gray-200">
                            {agentResponses.map((agent, idx) => (
                                <details key={idx} className="group">
                                    <summary className="p-4 cursor-pointer hover:bg-gray-50 transition-colors">
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center gap-3">
                                                <span className="text-2xl">
                                                    {agent.agent_name.includes('Extractor') ? '🔍' : 
                                                     agent.agent_name.includes('Calculator') ? '💰' : 
                                                     agent.agent_name.includes('Compute') ? '💻' : 
                                                     agent.agent_name.includes('Infrastructure') ? '🌐' : 
                                                     agent.agent_name.includes('Database') ? '💾' : 
                                                     agent.agent_name.includes('Container') ? '📦' : '🤖'}
                                                </span>
                                                <div>
                                                    <h4 className="font-semibold text-gray-900">{agent.agent_name}</h4>
                                                    <p className="text-sm text-gray-600">
                                                        Status: <span className={agent.status === 'success' ? 'text-green-600' : 'text-red-600'}>
                                                            {agent.status === 'success' ? '✓ Success' : '✗ Failed'}
                                                        </span>
                                                    </p>
                                                </div>
                                            </div>

                                    </summary>
                                    <div className="p-4 bg-gray-50">
                                        <pre className="text-xs text-gray-700 overflow-x-auto bg-white p-4 rounded border border-gray-200 whitespace-pre-wrap">
                                            {typeof agent.content === 'string' ? agent.content : JSON.stringify(agent.content, null, 2)}

                    {/* Excel Extraction Metadata (if available) */}

                                    <div className="bg-gray-50 rounded p-3 col-span-2">
                                        <p className="text-sm text-gray-600 mb-1">Sheet Names</p>
                                        <div className="flex flex-wrap gap-1">
                                            {results.excel_extraction_metadata.metadata.sheet_names.map((name, idx) => (
                                                <span key={idx} className="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-blue-100 text-blue-800">

                                onClick={() => {
                                    const dataStr = JSON.stringify(results, null, 2);

                                    const a = document.createElement('a');

                                onClick={() => {

                                    const url = URL.createObjectURL(blob);
                                    const a = document.createElement('a');

                                    a.download = `azure-resources-${Date.now()}.csv`;

                                    const a = document.createElement('a');
                                    a.href = url;
                                    a.download = `azure-cost-analysis-${Date.now()}.csv`;

        function calculateTopCostDrivers(resources) {
            // Filter resources with pricing and calculate total
            const resourcesWithPricing = resources.filter(r => 
                r.pricing?.pricing_status === 'found' && r.pricing?.monthly_cost
            );
            
            if (resourcesWithPricing.length === 0) return [];
            
            const totalCost = resourcesWithPricing.reduce((sum, r) => sum + (r.pricing.monthly_cost || 0), 0);
            
            // Sort by cost descending and take top 5
            const topDrivers = resourcesWithPricing
                .map(r => ({
                    resource_name: r.requirement || r.component || r.name || r.azure_service,
                    azure_service: r.azure_service,
                    monthly_cost: r.pricing.monthly_cost,
                    percentage_of_total: totalCost > 0 ? (r.pricing.monthly_cost / totalCost) * 100 : 0
                }))
                .sort((a, b) => b.monthly_cost - a.monthly_cost)
                .slice(0, 5)
                .map((item, idx) => ({ ...item, rank: idx + 1 }));
            
            return topDrivers;
        }

        function calculateOptimizationSummary(costSummary) {
            if (!costSummary?.total_monthly_cost) return null;
            
            const totalMonthlyCost = costSummary.total_monthly_cost;
            
            return {
                potential_monthly_savings_1year_ri: totalMonthlyCost * 0.30,
                optimized_monthly_cost_1year_ri: totalMonthlyCost * 0.70,
                potential_monthly_savings_3year_ri: totalMonthlyCost * 0.50,
                optimized_monthly_cost_3year_ri: totalMonthlyCost * 0.50
            };
        }

        function generateCSV(resources) {
            const headers = ['Requirement', 'Azure Service', 'Tier', 'SKU', 'Quantity', 'Monthly Cost', 'Annual Cost', 'Category', 'Description'];
            const rows = resources.map(r => [
                r.requirement || r.component || r.name || '',
                r.azure_service || '',
                r.tier || '',
                r.sku || '',
                r.quantity?.units || r.quantity || r.instance_count || '1',
                r.pricing?.monthly_cost?.toFixed(2) || '',
                r.pricing?.annual_cost?.toFixed(2) || '',
                r.category || '',
                (r.brief_description || r.purpose || r.description || r.rationale || '').replace(/"/g, '""')
            ]);
            
            const csvContent = [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
            ].join('\n');
            
            return csvContent;
        }

        function generateCostCSV(costDetails) {
            if (!costDetails || !costDetails.resources_pricing) {
                return 'No cost data available';
            }

            const headers = ['Resource Name', 'Azure Service', 'SKU', 'Quantity', 'Unit Price', 'Unit of Measure', 'Monthly Cost', 'Annual Cost', 'Pricing Status', 'Category'];
            const rows = costDetails.resources_pricing.map(r => [
                r.resource_name || '',
                r.azure_service || '',
                r.sku || '',
                r.quantity || '1',
                r.pricing_details?.retail_price_per_unit || '',
                r.pricing_details?.unit_of_measure || '',
                r.monthly_cost?.toFixed(2) || '',
                r.annual_cost?.toFixed(2) || '',
                r.pricing_status || '',
                r.category || ''
            ]);
            
            // Add summary rows
            const summaryRows = [
                [],
                ['COST SUMMARY'],
                ['Total Monthly Cost', '', '', '', '', '', costDetails.cost_summary?.total_monthly_cost?.toFixed(2) || '0.00'],
                ['Total Annual Cost', '', '', '', '', '', costDetails.cost_summary?.total_annual_cost?.toFixed(2) || '0.00'],
                ['Resources Priced', '', '', '', '', '', `${costDetails.cost_summary?.resources_with_pricing || 0}/${costDetails.cost_summary?.total_resources_priced || 0}`]
            ];

            // Add optimization summary if available
            if (costDetails.optimization_summary) {
                summaryRows.push(
                    [],
                    ['OPTIMIZATION OPPORTUNITIES'],
                    ['1-Year RI Savings', '', '', '', '', '', costDetails.optimization_summary.potential_monthly_savings_1year_ri?.toFixed(2) || '0.00'],
                    ['3-Year RI Savings', '', '', '', '', '', costDetails.optimization_summary.potential_monthly_savings_3year_ri?.toFixed(2) || '0.00']
                );
            }
            
            const csvContent = [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${cell}"`).join(',')),
                ...summaryRows.map(row => row.map(cell => `"${cell}"`).join(','))
            ].join('\n');
            
            return csvContent;
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
